<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241242" />
      <stop offset="45%" stop-color="#3B2A6B" />
      <stop offset="85%" stop-color="#7B1A66" />
      <stop offset="100%" stop-color="#B0206B" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Subtle gradient circles -->
  <circle cx="150" cy="120" r="220" fill="#B0206B" opacity="0.3" />
  <circle cx="1050" cy="500" r="260" fill="#FFD166" opacity="0.15" />
  <circle cx="950" cy="150" r="200" fill="#4E348A" opacity="0.4" />

  <!-- Inner Card Container -->
  <rect x="50" y="50" width="1100" height="530" rx="28" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Category Pill -->
  <g transform="translate(600, 130)">
    <rect x="-200" y="-22" width="400" height="44" rx="22" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1" />
    <text x="0" y="6" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFD166" letter-spacing="2">
      SPECIAL EDUCATION &amp; CHILD SUPPORT
    </text>
  </g>

  <!-- Main Title -->
  <text x="600" y="240" text-anchor="middle" font-family="'Georgia', 'Times New Roman', serif" font-size="62" font-weight="bold" fill="#ffffff" letter-spacing="-0.5">
    The Shadow Bridge
  </text>

  <!-- Subtitle / Tagline -->
  <text x="600" y="310" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#E8DBF9">
    Connecting Families with Certified Shadow Teachers, Home Tutors &amp; Therapists
  </text>
  <text x="600" y="348" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#D2BEEB">
    Inclusive Classroom Assistance • ABA &amp; Speech Therapy • Special Needs Mentorship
  </text>

  <!-- Location Badge -->
  <g transform="translate(600, 440)">
    <rect x="-420" y="-30" width="840" height="60" rx="18" fill="#140827" fill-opacity="0.55" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" />
    <text x="0" y="8" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" letter-spacing="0.5">
      Delhi NCR  •  Mumbai  •  Ahmedabad  •  Hyderabad  •  Bangalore  •  Pune  •  PAN-India Online
    </text>
  </g>

  <!-- Trust Mark -->
  <text x="600" y="540" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#F0E3FF" opacity="0.85">
    www.theshadowbridge.com  •  Verified &amp; Background-Checked Educators
  </text>
</svg>